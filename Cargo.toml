[package]
name = "syncwork"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Peer-to-peer cross-platform build verification and AI context sync"
license = "MIT"

[[bin]]
name = "sw"
path = "src/main.rs"

[dependencies]
iroh = "1.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# For CLI edits to an existing syncwork.toml. serde round-tripping would discard
# the user's comments and ordering; toml_edit preserves them.
toml_edit = "0.23"
anyhow = "1"
thiserror = "2"
directories = "6"
hex = "0.4"
data-encoding = "2"
zstd = "0.13"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
# For the log's local-time stamps. `local-offset` is the feature that reads the
# machine's zone; see `local_timer` in main.rs for why it has to run before the
# async runtime exists.
time = { version = "0.3", features = ["local-offset", "macros", "formatting"] }
gethostname = "1"
postcard = { version = "1.1.3", features = ["use-std"] }
# LAN discovery: machines on the same network find each other by multicast,
# with no relay and no public DNS involved. Additive — one more lookup source
# beside the N0 preset's, quietly useless anywhere multicast does not reach.
iroh-mdns-address-lookup = "0.5.0"
futures-lite = "2.6.1"
diffy = "0.5.1"
ratatui = "0.30.2"

[profile.release]
strip = true
