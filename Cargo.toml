[package]
name = "syncwork"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Peer-to-peer cross-platform build verification and AI context sync"
license = "MIT"

[[bin]]
name = "sw"
path = "src/main.rs"

[dependencies]
iroh = "1.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
thiserror = "2"
directories = "6"
hex = "0.4"
data-encoding = "2"
zstd = "0.13"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gethostname = "1"
postcard = { version = "1.1.3", features = ["use-std"] }

[profile.release]
strip = true
